name: arculus_sdk
description: Arculus SDK Flutter plugin for hardware wallet integration.
version: 1.0.0
homepage: https://github.com/santium/arculus-sdk-flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  convert: ^3.0.0
  json_annotation: ^4.0.1
  freezed: ^2.5.2
  freezed_annotation: ^2.4.1
  # FFI dependencies
  ffi: ^2.1.0
  path: ^1.8.3
  nfc_manager: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  json_serializable: ^6.6.1
  # FFI code generation
  ffigen: ^11.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.arculus.arculus_sdk
        pluginClass: ArculusSdkPlugin
      ios:
        pluginClass: ArculusSdkPlugin 

# FFI configuration
ffigen:
  output: 'lib/src/bindings/csdk_bindings.dart'
  headers:
    entry-points:
      - '../csdk-1.0.0/include/csdk.h'
      - '../csdk-1.0.0/include/csdk_types.h'
  name: 'CsdkBindings'
  description: 'Auto-generated bindings for Arculus CSDK' 